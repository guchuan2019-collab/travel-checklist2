<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-trae-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅行物品清单</title>
<style>
:root{
  --bg:#eef3f8; --card:#ffffff; --ink:#1f2a37; --sub:#5b6b7f;
  --brand:#0e8f8f; --brand2:#13a4a4; --brand-soft:#e6f6f6;
  --line:#e3e9f0; --warn:#d97706; --ok:#16a34a; --danger:#dc2626;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:0 14px 80px;}
header.top{
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff; padding:18px 16px 16px; border-radius:0 0 18px 18px;
  box-shadow:0 6px 18px rgba(14,143,143,.25);
  position:sticky; top:0; z-index:20;
}
header.top h1{margin:0; font-size:20px; font-weight:700; letter-spacing:.5px;}
header.top .sub{font-size:12px; opacity:.92; margin-top:3px;}
nav.tabs{display:flex; gap:8px; margin-top:12px;}
nav.tabs button{
  flex:1; border:0; background:rgba(255,255,255,.16); color:#fff;
  padding:8px 10px; border-radius:10px; font-size:14px; cursor:pointer; font-weight:600;
}
nav.tabs button.active{background:#fff; color:var(--brand);}
.card{background:var(--card); border-radius:var(--radius); padding:16px; margin-top:14px;
  box-shadow:0 3px 14px rgba(20,40,60,.06);}
h2.sec{font-size:16px; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
h2.sec .cnt{font-size:12px; color:var(--sub); font-weight:400;}
label.fld{display:block; font-size:13px; color:var(--sub); margin:12px 0 5px; font-weight:600;}
input[type=text],input[type=date],select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
  font-size:15px; background:#fff; color:var(--ink); outline:none;
}
input:focus,select:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);}
.row2{display:flex; gap:10px;} .row2>*{flex:1;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft);
  color:var(--brand); border:1px solid #cdeaeb; padding:6px 10px; border-radius:20px; font-size:14px;}
.chip button{border:0; background:transparent; color:var(--brand); cursor:pointer; font-size:16px; line-height:1;}
.goalGrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.goalGrid label{display:flex; align-items:center; gap:8px; background:#f7fafb; border:1px solid var(--line);
  border-radius:10px; padding:10px; font-size:14px; cursor:pointer;}
.goalGrid input{accent-color:var(--brand); width:18px; height:18px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:600; cursor:pointer;
  background:var(--brand); color:#fff; transition:transform .05s;}
.btn:active{transform:scale(.98);}
.btn.ghost{background:#eef3f8; color:var(--ink);}
.btn.danger{background:#fee; color:var(--danger);}
.btn.block{width:100%; margin-top:6px;}
.btn.sm{padding:6px 10px; font-size:13px;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.toolbar .btn{flex:1; min-width:120px;}
.disclaimer{font-size:12px; color:var(--sub); margin-top:14px; line-height:1.6;
  background:#fffaf0; border:1px dashed #f0d9a0; border-radius:10px; padding:10px;}

/* checklist */
.summary{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:13px; color:var(--sub);}
.summary b{color:var(--ink); font-weight:600;}
.progress{height:10px; background:#eaf0f4; border-radius:6px; overflow:hidden; margin:6px 0 2px;}
.progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .3s;}
.progTxt{font-size:12px; color:var(--sub);}
.catSec{margin-top:14px;}
.catHead{display:flex; align-items:center; justify-content:space-between;
  background:var(--brand-soft); border-radius:10px; padding:9px 12px; margin-bottom:8px;}
.catHead h3{margin:0; font-size:15px; color:var(--brand); font-weight:700;}
.catHead .cc{font-size:12px; color:var(--brand);}
.item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:0;}
.item input[type=checkbox]{accent-color:var(--brand); width:20px; height:20px; flex:none;}
.item .t{flex:1; font-size:15px; word-break:break-word;}
.item.done .t{text-decoration:line-through; color:#9aa6b3;}
.qty{display:flex; align-items:center; gap:4px; flex:none;}
.qty button{width:26px; height:26px; border:1px solid var(--line); background:#fff; border-radius:7px;
  font-size:16px; cursor:pointer; color:var(--ink); line-height:1;}
.qty span{min-width:22px; text-align:center; font-size:14px; color:var(--sub);}
.del{border:0; background:transparent; color:#c0c8d2; cursor:pointer; font-size:18px; flex:none; padding:4px;}
.del:hover{color:var(--danger);}
.addItem{display:flex; gap:6px; margin-top:8px;}
.addItem input{flex:1; padding:9px 10px;}
.note-item{background:#fffdf3;}
.empty{text-align:center; color:#9aa6b3; padding:18px; font-size:14px;}

/* history */
.tripRow{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
.tripRow .nm{font-weight:700; font-size:15px;}
.tripRow .meta{font-size:12px; color:var(--sub); margin-top:4px;}
.tripRow .acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

.dateRange{display:flex; align-items:center; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff;}
.dateRange input{flex:1; border:0; border-radius:0; padding:11px 10px; text-align:center; font-size:14px; background:transparent;}
.dateRange .sep{color:var(--brand); font-weight:700; font-size:18px; user-select:none; padding:0 4px;}
.dateRange input:first-child{border-right:1px solid var(--line);}
.dateRange input::-webkit-calendar-picker-indicator{cursor:pointer;}

/* Toast */
#toast{position:fixed; left:50%; top:52px; transform:translateX(-50%); z-index:30;
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .25s, top .25s;}
#toast.show{opacity:1; top:72px;}

@media print{
  header.top,nav.tabs,.toolbar,.addItem,.del,.qty button,.btn,#toast{display:none !important;}
  body{background:#fff;}
  .wrap{max-width:100%;}
  .card{box-shadow:none; break-inside:avoid;}
  .item{padding:4px 0;}
}
@media(max-width:420px){ .goalGrid{grid-template-columns:1fr;} .summary{grid-template-columns:1fr;} }
</style>

}

  var v = el('fDest').value.trim();
  if(!v) return;
  if(state.dests.indexOf(v)>=0){ el('fDest').value=''; return; }
  state.dests.push(v); el('fDest').value=''; renderChips();
}
function removeDest(i){ state.dests.splice(i,1); renderChips(); }
function renderChips(){
  var c = el('destChips'); c.innerHTML='';
  state.dests.forEach(function(d,i){
    var chip = document.createElement('span'); chip.className='chip';
    chip.innerHTML = d+' <button onclick="removeDest('+i+')">×</button>';
    c.appendChild(chip);
  });
}

/* ============ 生成逻辑 ============ */
function tripMonths(start,end){
  var s=new Date(start), e=new Date(end);
  var ms=new Set(), guard=0;
  var d=new Date(s.getFullYear(),s.getMonth(),1);
  var em=new Date(e.getFullYear(),e.getMonth(),1);
  while(d<=em && guard<24){ ms.add(d.getMonth()); d.setMonth(d.getMonth()+1); guard++; }
  return Array.from(ms);
}
function weatherItems(city, months){
  var c = CLIMATE[city], arr=[];
  if(!c) return arr;
  months.forEach(function(m){
    if(c.rain.indexOf(m)>=0){ arr.push('雨伞'); arr.push('防水鞋/雨鞋'); }
    if(c.snow.indexOf(m)>=0){ arr.push('保暖厚外套'); arr.push('围巾手套'); arr.push('防滑鞋'); }
    if(c.cold.indexOf(m)>=0){ arr.push('保暖内衣/抓绒'); }
    if(c.hot.indexOf(m)>=0){ arr.push('遮阳伞'); arr.push('高倍防晒霜'); arr.push('墨镜'); arr.push('轻薄透气衣物'); }
  });
  return arr;
}
function uniq(a){ var seen={},r=[]; a.forEach(function(x){ if(!seen[x]){seen[x]=1; r.push(x);} }); return r; }

function generate(){
  if(el('fDest').value.trim()){ addDest(); } // 自动把框里还没添加的目的地加进去
  var dep = el('fDep').value.trim();
  var dests = state.dests.slice();
  var start = el('fStart').value, end = el('fEnd').value;
  var goals = state.goals.slice();
  var laundry = el('fLaundry').checked;
  var pet = el('fPet').checked;
  var name = el('fName').value.trim() || (dep+' → '+dests.join('/'));
  if(!dep){ showToast('请填写出发地'); return; }
  if(dests.length===0){ showToast('请添加至少一个目的地'); return; }
  if(!start||!end){ showToast('请选择出行日期'); return; }

  var days = Math.max(1, Math.round((new Date(end)-new Date(start))/86400000)+1);
  var clothDays = laundry ? Math.ceil(days/2) : days;
  var months = tripMonths(start,end);
  var startMonth = new Date(start).getMonth();
  var endMonth = new Date(end).getMonth();
  var depCountry = CLIMATE[dep] ? CLIMATE[dep].country : null;

  var items = {};
  CATS.forEach(function(c){ items[c]=[]; });

  // 基础清单（按类别智能计算数量）
  Object.keys(BASE).forEach(function(cat){
    BASE[cat].forEach(function(t){
      var qty = 1;
      if(cat === '衣服服饰'){
        if(t.indexOf('内裤')>=0 || t.indexOf('袜子')>=0 || t.indexOf('T恤')>=0 || t.indexOf('上衣')>=0) qty = clothDays;
        else if(t.indexOf('裤子')>=0) qty = Math.max(1, Math.ceil(clothDays/2));
        else if(t.indexOf('睡衣')>=0) qty = Math.min(clothDays, 2);
      }
      items[cat].push({id:uid(), text:t, qty:qty, checked:false});
    });
  });

  // 宠物相关 → 待办事项
  if(pet){
    items['待办事项'].push({id:uid(), text:'准备充足猫粮 / 设置自动喂食器', qty:1, checked:false});
    items['待办事项'].push({id:uid(), text:'准备充足猫水 / 设置自动饮水机', qty:1, checked:false});
    items['待办事项'].push({id:uid(), text:'安装/检查宠物监控器', qty:1, checked:false});
  }

  // 行程专属：动态生成
  var custom = [];
  custom.push('行程共 '+days+' 天，已按 '+clothDays+' 套准备内衣袜子'+(laundry?'（已开中途洗衣，减半）':''));

  // 跨境判定 + 签证/插头/货币
  dests.forEach(function(d){
    var dc = CLIMATE[d] ? CLIMATE[d].country : null;
    if(!dc){ custom.push('【'+d+'】暂无数据，请自行确认是否需出境手续及当地天气'); return; }
    if(depCountry && dc !== depCountry){
      custom.push('境外旅游保险（建议打印保单）');
      custom.push('当地流量卡 / 国际漫游或SIM卡');
      var ci = COUNTRY[dc];
      if(ci){
        if(ci.plug) custom.push('转换插头（'+ci.plug+'，'+ci.voltage+'）');
        if(ci.extra) ci.extra.forEach(function(e){ custom.push(e); });
        if(ci.visa) custom.push('【'+dc+'】签证：'+ci.visa);
        if(ci.currency) custom.push('兑换外币：'+ci.currency);
      }
    } else if(depCountry && dc === depCountry){
      var ci2 = COUNTRY[dc];
      if(ci2 && ci2.visa && dc!=='中国') custom.push('【'+dc+'】签证：'+ci2.visa);
    } else if(!depCountry){
      custom.push('【'+d+'】出发地数据缺失，请自行确认是否需出境手续');
    }
  });
  custom = uniq(custom);

  // 天气：出发地（出发/返回日所在月）
  if(CLIMATE[dep]){
    if(CLIMATE[dep].rain.indexOf(startMonth)>=0) custom.push('出发当天 '+dep+' 可能下雨，记得带伞/雨衣去机场');
    if(CLIMATE[dep].rain.indexOf(endMonth)>=0) custom.push('返程当天 '+dep+' 可能下雨，记得带伞');
    weatherItems(dep,[startMonth,endMonth]).forEach(function(x){ custom.push(x); });
  } else {
    custom.push('【'+dep+'】出发地暂无气候数据，请自行确认出发天气');
  }
  // 目的地天气
  dests.forEach(function(d){
    var di = weatherItems(d,months);
    if(di.length===0 && !CLIMATE[d]) custom.push('【'+d+'】暂无气候数据，请自行确认当地天气');
    di.forEach(function(x){ custom.push(x); });
  });
  custom = uniq(custom);

  // 旅行目标专属
  goals.forEach(function(g){ if(GOALS[g]) GOALS[g].items.forEach(function(it){ custom.push(it); }); });
  custom = uniq(custom);

  custom.forEach(function(t){ items['行程专属'].push({id:uid(), text:t, qty:1, checked:false}); });

  state.trip = { name:name, dep:dep, dests:dests, start:start, end:end, goals:goals, laundry:laundry, pet:pet, days:days, clothDays:clothDays, items:items };
  renderList();
  go('list');
  autoSave(); // 生成后自动保存
}

/* ============ 清单渲染与交互 ============ */
function renderList(){
  var t = state.trip; if(!t) return;
  el('listTitle').textContent = '🧳 ' + t.name;
  var s = el('summary');
  s.innerHTML =
    '<div>出发地：<b>'+esc(t.dep)+'</b></div>'+
    '<div>目的地：<b>'+esc(t.dests.join('、'))+'</b></div>'+
    '<div>日期：<b>'+t.start+' ~ '+t.end+'</b></div>'+
    '<div>天数：<b>'+t.days+' 天</b>'+(t.laundry?' <span style="color:var(--warn)">(洗衣减半)</span>':'')+'</div>'+
    '<div>目标：<b>'+(t.goals.length?t.goals.join('、'):'无')+'</b></div>';
  var cl = el('catList'); cl.innerHTML='';
  CATS.forEach(function(cat){
    var sec = document.createElement('div'); sec.className='catSec';
    var head = document.createElement('div'); head.className='catHead';
    head.innerHTML = '<h3>'+cat+'</h3><span class="cc" id="cc-'+cat+'"></span>';
    sec.appendChild(head);
    var list = document.createElement('div'); list.id='list-'+cat;
    sec.appendChild(list);
    // 添加物品
    var add = document.createElement('div'); add.className='addItem';
    add.innerHTML = '<input type="text" placeholder="添加自定义物品…" onkeydown="if(event.key===\'Enter\')addItem(\''+cat+'\')">'+
      '<button class="btn sm" onclick="addItem(\''+cat+'\')">+</button>';
    sec.appendChild(add);
    cl.appendChild(sec);
    renderCat(cat);
  });
  updateProgress();
}
function renderCat(cat){
  var t = state.trip; if(!t) return;
  var list = el('list-'+cat); list.innerHTML='';
  var arr = t.items[cat];
  if(!arr || arr.length===0){ list.innerHTML='<div class="empty">暂无</div>'; el('cc-'+cat).textContent=''; return; }
  arr.forEach(function(it,idx){
    var row = document.createElement('div'); row.className='item'+(it.checked?' done':'');
    var cb = document.createElement('input'); cb.type='checkbox'; cb.checked=it.checked;
    cb.onchange = function(){ it.checked=cb.checked; row.classList.toggle('done',it.checked); updateProgress(); autoSave(); };
    var span = document.createElement('span'); span.className='t'; span.textContent = it.text;
    row.appendChild(cb); row.appendChild(span);
    var q = document.createElement('div'); q.className='qty';
    q.innerHTML = '<button onclick="chgQty(\''+cat+'\','+idx+',-1)">−</button>'+
      '<span>×'+it.qty+'</span><button onclick="chgQty(\''+cat+'\','+idx+',1)">+</button>';
    row.appendChild(q);
    var del = document.createElement('button'); del.className='del'; del.textContent='×'; del.title='删除';
    del.onclick = function(){ if(confirm('删除「'+it.text+'」？')){ t.items[cat].splice(idx,1); renderCat(cat); updateProgress(); autoSave(); } };
    row.appendChild(del);
    list.appendChild(row);
  });
  var done = arr.filter(function(x){return x.checked;}).length;
  el('cc-'+cat).textContent = done+'/'+arr.length;
}
function chgQty(cat,i,d){ var it=state.trip.items[cat][i]; if(!it)return; it.qty=Math.max(1,it.qty+d); renderCat(cat); autoSave(); }
function addItem(cat){
  var inp = el('list-'+cat).parentNode.querySelector('.addItem input');
  var v = inp.value.trim(); if(!v) return;
  state.trip.items[cat].push({id:uid(), text:v, qty:1, checked:false});
  inp.value=''; renderCat(cat); updateProgress(); autoSave();
}
function updateProgress(){
  var t=state.trip; if(!t) return; var tot=0,done=0;
  CATS.forEach(function(c){ (t.items[c]||[]).forEach(function(x){ tot++; if(x.checked)done++; }); });
  var pct = tot? Math.round(done*100/tot):0;
  el('progBar').style.width = pct+'%';
  el('progTxt').textContent = '完成 '+done+' / '+tot+'（'+pct+'%）';
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ============ 持久化 ============ */
var KEY = 'travel_checklist_trips_v1';
var CURRENT = 'travel_checklist_current_v1';
function loadAll(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
function saveAll(a){ localStorage.setItem(KEY, JSON.stringify(a)); }
function saveCurrent(){ if(state.trip) localStorage.setItem(CURRENT, JSON.stringify(state.trip)); }
function loadFromStorageKeep(){
  try{ var t=JSON.parse(localStorage.getItem(CURRENT)||'null'); if(t){ state.trip=t; } }catch(e){}
}
function showToast(msg){
  var t=el('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}
function autoSave(){
  if(!state.trip) return;
  var all = loadAll();
  if(!state.trip.id){ state.trip.id = uid(); state.trip.savedAt = Date.now(); all.push(state.trip); }
  else { var i=all.findIndex(function(x){return x.id===state.trip.id;}); if(i>=0) all[i]=state.trip; else all.push(state.trip); }
  saveAll(all); saveCurrent();
}
function saveTrip(){
  if(!state.trip){ showToast('请先生成清单'); return; }
  autoSave();
  showToast('保存成功：'+state.trip.name);
}
function renderHistory(){
  var all = loadAll(); var hl = el('hisList'); hl.innerHTML='';
  if(all.length===0){ hl.innerHTML='<div class="empty">暂无历史记录</div>'; return; }
  all.sort(function(a,b){return (b.savedAt||0)-(a.savedAt||0);});
  all.forEach(function(t){
    var row=document.createElement('div'); row.className='tripRow';
    row.setAttribute('data-id', t.id);

    // 名称区（支持内联编辑）
    var nmWrap=document.createElement('div'); nmWrap.className='nmWrap';
    var nm=document.createElement('div'); nm.className='nm'; nm.textContent=t.name||'未命名';
    nmWrap.appendChild(nm);
    row.appendChild(nmWrap);

    row.innerHTML+='<div class="meta">'+esc(t.dep)+' → '+esc((t.dests||[]).join('、'))+'｜'+(t.start||'?')+' ~ '+(t.end||'?')+'｜'+(t.days||'?')+'天</div>';

    // 操作按钮区
    var acts=document.createElement('div'); acts.className='acts';
    var b1=document.createElement('button'); b1.className='btn sm'; b1.textContent='查看'; b1.onclick=function(){ openTrip(t.id); };
    var b2=document.createElement('button'); b2.className='btn sm ghost'; b2.textContent='复制为模板'; b2.onclick=function(){ copyTemplate(t.id); };
    var b3=document.createElement('button'); b3.className='btn sm ghost'; b3.textContent='重命名'; b3.onclick=function(){ startRename(row, t.id); };
    var b4=document.createElement('button'); b4.className='btn sm danger'; b4.textContent='删除'; b4.onclick=function(){ startDelete(row, t.id); };
    [b1,b2,b3,b4].forEach(function(b){acts.appendChild(b);});
    row.appendChild(acts);
    hl.appendChild(row);
  });
}
function startDelete(row, id){
  var acts=row.querySelector('.acts'); if(!acts) return;
  acts.innerHTML='';
  var hint=document.createElement('span'); hint.textContent='确定删除？'; hint.style.cssText='font-size:13px;color:var(--sub);align-self:center;';
  var yes=document.createElement('button'); yes.className='btn sm danger'; yes.textContent='确认删除';
  yes.onclick=function(){ doDelete(id); };
  var no=document.createElement('button'); no.className='btn sm ghost'; no.textContent='取消';
  no.onclick=function(){ renderHistory(); };
  acts.appendChild(hint); acts.appendChild(yes); acts.appendChild(no);
}
function doDelete(id){
  var all=loadAll(); var removed=all.filter(function(x){return x.id===id;})[0];
  all=all.filter(function(x){return x.id!==id;}); saveAll(all); renderHistory();
  if(removed) showToast('已删除：'+(removed.name||'未命名'));
}
function startRename(row, id){
  var nmWrap=row.querySelector('.nmWrap'); if(!nmWrap) return;
  var oldNm=nmWrap.querySelector('.nm'); var oldText=oldNm?oldNm.textContent:'';
  nmWrap.innerHTML='';
  var inp=document.createElement('input'); inp.type='text'; inp.value=oldText;
  inp.style.cssText='width:100%;padding:6px 8px;border:1px solid var(--brand);border-radius:8px;font-size:15px;outline:none;';
  inp.onkeydown=function(e){ if(e.key==='Enter'){ finishRename(row, id, inp.value); } if(e.key==='Escape'){ renderHistory(); } };
  inp.onblur=function(){ finishRename(row, id, inp.value); };
  nmWrap.appendChild(inp); inp.focus(); inp.select();
}
function finishRename(row, id, newName){
  var n=(newName||'').trim(); if(!n){ renderHistory(); return; }
  var all=loadAll(); var i=all.findIndex(function(x){return x.id===id;}); if(i<0){ renderHistory(); return; }
  all[i].name=n; saveAll(all); renderHistory(); showToast('已重命名为：'+n);
}
function openTrip(id){
  var all=loadAll(); var t=all.filter(function(x){return x.id===id;})[0];
  if(!t) return; state.trip=t; renderList(); go('list');
}
function copyTemplate(id){
  var all=loadAll(); var t=all.filter(function(x){return x.id===id;})[0]; if(!t) return;
  // 还原到表单
  el('fName').value = (t.name||'')+' 副本';
  el('fDep').value = t.dep||'';
  state.dests = (t.dests||[]).slice(); renderChips();
  el('fStart').value = t.start||''; el('fEnd').value = t.end||'';
  el('fLaundry').checked = !!t.laundry;
  el('fPet').checked = !!t.pet;
  // 目标勾选
  var cbs = el('goalBox').querySelectorAll('input'); cbs.forEach(function(c){ c.checked = (t.goals||[]).indexOf(c.value)>=0; });
  state.goals = Array.from(el('goalBox').querySelectorAll('input:checked')).map(function(c){return c.value;});
  go('form'); showToast('已载入模板到表单，可修改后重新生成');
}
function exportJSON(){
  var all=loadAll(); var blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='旅行清单备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importJSON(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ var arr=JSON.parse(r.result); if(!Array.isArray(arr)) throw 0;
      var all=loadAll(); arr.forEach(function(t){ t.id=t.id||uid(); t.savedAt=t.savedAt||Date.now(); all.push(t); });
      saveAll(all); renderHistory(); showToast('导入成功，共 '+arr.length+' 条');
    }catch(err){ showToast('导入失败：文件格式不正确'); }
  };
  r.readAsText(f); e.target.value='';
}

/* 页面加载时若存在上次记录，直接显示 */
window.addEventListener('load', function(){ if(state.trip){ renderList(); } });
</script>
